name: Fetch Posts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch posts
        run: node fetch.js

      - name: Commit new data
        run: |
          git config user.name "Murali"
          git config user.email "muralisudireddy0@gmail.com"

          git add data.json
          git commit -m "Update posts" || echo "No changes"
          git push